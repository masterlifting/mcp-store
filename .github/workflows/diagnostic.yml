name: diagnostic-packaged-workflow

# Temporary read-only diagnostic for the packaged Workflow PersistenceFailure seen on the PR #41 branch. A
# branch-only push trigger is what makes a new workflow file effective before it reaches the default branch; a
# workflow_dispatch-only trigger would require this file to already exist on main. Remove this file before promoting.
on:
  push:
    branches:
      - ghi-24-ci-hotfix

# Least privilege: read-only. This run holds no credential, writes no repository state and publishes nothing.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  packaged-coordination:
    name: packaged-workflow-coordination
    runs-on: windows-latest
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: project canonical toolchain from the policy JSON (no SDK or F# needed)
        id: project
        shell: pwsh
        # Participants.json and each producer's release/Config.json stay the only SDK source, so no version is restated here.
        run: pwsh infrastructure/release/Update.ps1 -Project

      - name: setup .NET SDK from the canonical projection
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.project.outputs.sdk }}

      - name: build the actual workflow package (native exit preserved)
        shell: pwsh
        # The same package entrypoint the release pipeline runs, so the DLL under test is the real generated artifact.
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          & dotnet fsi workflow/release/Build.fsx
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "workflow package build failed (exit $code)" }

      - name: print packaged provenance for this run
        shell: pwsh
        # Provenance only: the exact event HEAD, the revision the generated manifest stamped, and the entry DLL hash.
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          $manifest = Get-Content -LiteralPath workflow/dist/workflow/distribution.json -Raw | ConvertFrom-Json
          $entryDll = (Resolve-Path -LiteralPath workflow/dist/workflow/Mcp.Workflow.dll).Path
          $entryDllSha256 = (Get-FileHash -LiteralPath $entryDll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "event HEAD: $head"
          Write-Host "package manifest revision: $($manifest.revision)"
          Write-Host "package identity: $($manifest.id) $($manifest.version) entryDll=$($manifest.entryDll)"
          Write-Host "package entry DLL: $entryDll"
          Write-Host "package entry DLL sha256: $entryDllSha256"

      - name: run the packaged runtime coordination gate against the built package (native exit preserved)
        shell: pwsh
        # One invocation only: no retry, no sleep, no timeout extension and no stress. The test prints the full apply
        # error, both child stderr snapshots and the sidecar bytes before its assertion, so a failure is self-contained here.
        env:
          MCP_WORKFLOW_PACKAGED_DLL: ${{ github.workspace }}/workflow/dist/workflow/Mcp.Workflow.dll
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          & dotnet fsi workflow/tests/PackagedRuntimeCoordinationTests.fsx
          exit $LASTEXITCODE
