name: unix

# This workflow is a read-only pull-request qualification path; it never publishes, never holds a write token, and never shares the main-only release graph.
# Explicit images and RIDs prevent a floating runner label from silently changing the qualified platform.
# The projection supplies the SDK and producer roster, so this file carries no toolchain or participant literal.

# The same Telegram-only exclusion as release.yml: Telegram is not a .NET release input. Check.ps1 in the release publisher job is the enforcing guard for this trigger.
on:
  pull_request:
    paths-ignore:
      - 'telegram/**'

concurrency:
  group: unix-${{ github.event.pull_request.number }}
  # Cancelling a superseded run discards no shared publication state: this path is pull-request-only, read-only and non-publishing.
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  qualification:
    name: qualify (${{ matrix.image }}, ${{ matrix.rid }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            rid: linux-x64
          - image: macos-15
            rid: osx-arm64
          - image: macos-15-intel
            rid: osx-x64
    steps:
      - name: checkout the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request defaults to a synthetic merge commit; only the author's head commit is the qualification input.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: advisory pre-merge check of this workflow's own trigger shape
        shell: pwsh
        # ADVISORY ONLY: with no required status check on main, a pull request that broadens this file's own filter also skips this step.
        # The enforcing point for both workflows is infrastructure/release/Check.ps1 in the release publisher job. This subset is portable
        # (forward-slash path, no Windows-only API) and runs the three negative cases against in-memory variants of the parsed block.
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $path = ".github/workflows/unix.yml"
          $event = "pull_request"
          $exclusion = "      - 'telegram/**'"
          $expected = @("  pull_request:", "    paths-ignore:", $exclusion)
          function Read-Trigger {
            param([string[]]$Lines)
            $start = [array]::IndexOf($Lines, "on:")
            if ($start -lt 0) { throw "the workflow declares no top-level on: block" }
            $block = @()
            for ($i = $start + 1; $i -lt $Lines.Count; $i++) {
              $line = $Lines[$i]
              if ([string]::IsNullOrWhiteSpace($line) -or $line.TrimStart().StartsWith("#")) { continue }
              if (-not $line.StartsWith(" ")) { break }
              $block += $line
            }
            return $block
          }
          function Get-Faults {
            param([string[]]$Block)
            $faults = @()
            $events = @($Block | Where-Object { $_ -match '^  [^\s#][^:]*:' } | ForEach-Object { ($_ -replace '^  ([^:]+):.*$', '$1') })
            if (($events -join ",") -cne $event) { $faults += "event keys [$($events -join ', ')] where only '$event' is allowed" }
            foreach ($key in @("paths", "branches-ignore", "tags", "tags-ignore")) {
              if (@($Block | Where-Object { $_ -match ('^\s+' + $key + ':') }).Count -ne 0) { $faults += "forbidden '$key' filter" }
            }
            $index = [array]::IndexOf($Block, "    paths-ignore:")
            if (@($Block | Where-Object { $_ -match '^\s+paths-ignore:' }).Count -ne 1 -or $index -lt 0) {
              $faults += "exactly one paths-ignore block is required"
            } else {
              $items = @()
              for ($i = $index + 1; $i -lt $Block.Count; $i++) { if ($Block[$i].StartsWith("      ")) { $items += $Block[$i] } else { break } }
              if ($items.Count -ne 1 -or $items[0] -cne $exclusion) { $faults += "paths-ignore must carry exactly the one expected exclusion item" }
            }
            if (($Block -join "`n") -cne ($expected -join "`n")) { $faults += "the trigger block is not the exact expected shape" }
            return $faults
          }
          $block = @(Read-Trigger -Lines @(Get-Content -LiteralPath $path | ForEach-Object { $_.TrimEnd() }))
          $actual = @(Get-Faults -Block $block)
          if ($actual.Count -ne 0) { throw "the trigger shape is not accepted: $($actual -join '; ')" }
          $text = $block -join "`n"
          $variants = [ordered]@{
            "broadened exclusion" = ($text -replace [regex]::Escape($exclusion), ($exclusion + "`n      - 'docs/**'"))
            "missing exclusion"   = ($text -replace '(?m)^    paths-ignore:\n[^\n]*(\n|$)', '')
            "extra event"         = ($text + "`n  schedule:`n    - cron: '0 0 * * *'")
          }
          foreach ($name in $variants.Keys) {
            $variant = @($variants[$name] -split "`n")
            if ($variants[$name] -ceq $text -or @(Get-Faults -Block $variant).Count -eq 0) { throw "the negative case '$name' was not rejected" }
            Write-Host "negative case rejected: $name"
          }
          Write-Host "trigger shape accepted; three negative cases rejected (advisory)"

      - name: project the canonical toolchain from the policy JSON
        id: project
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Project

      - name: setup the canonical .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.project.outputs.sdk }}

      - name: verify the executing SDK and record the runner toolchain
        shell: pwsh
        env:
          SDK: ${{ steps.project.outputs.sdk }}
          IMAGE: ${{ matrix.image }}
          RID: ${{ matrix.rid }}
          # The expected revision comes from the trusted event rather than from the checkout being verified, and never from free text such as a title.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHead = $env:HEAD_SHA
          $actualHead = (& git "rev-parse" "HEAD").Trim()
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD failed (exit $LASTEXITCODE)" }
          Write-Host "checked out head=$actualHead expected head=$expectedHead"
          if ($actualHead -cne $expectedHead) { throw "the checked out HEAD '$actualHead' is not the pull request head '$expectedHead'" }
          $sdk = $env:SDK
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw "the canonical projection emitted no SDK version" }
          $lines = @(& dotnet "--list-sdks")
          if ($LASTEXITCODE -ne 0) { throw "dotnet --list-sdks failed (exit $LASTEXITCODE)" }
          $versions = @($lines | ForEach-Object { if ($_ -match '^(?<version>\S+)\s+\[') { $Matches['version'] } })
          $current = (& dotnet "--version").Trim()
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed (exit $LASTEXITCODE)" }
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          Write-Host "matrix image=$($env:IMAGE) rid=$($env:RID)"
          Write-Host "runtime rid=$rid os=$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription) arch=$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture) process=$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          Write-Host "pwsh=$($PSVersionTable.PSVersion) git=$(& git "--version")"
          Write-Host "canonical sdk=$sdk selected=$current installed=[$($versions -join ', ')]"
          if ($versions -cnotcontains $sdk) { throw "the canonical SDK '$sdk' is not installed; observed [$($versions -join ', ')]" }
          if ($current -cne $sdk) { throw "the selected SDK is '$current' where the canonical projection declares '$sdk'" }
          if ($rid -cne $env:RID) { throw "the runner reports RID '$rid' where the matrix declares '$($env:RID)'" }
          & dotnet "--info"
          if ($LASTEXITCODE -ne 0) { throw "dotnet --info failed (exit $LASTEXITCODE)" }

      - name: pack every enrolled canonical distribution from the exact head
        shell: pwsh
        # Every enrolled distribution is packed from the exact head; the roster keeps the resolver last.
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $components = @(ConvertFrom-Json $env:RELEASE_COMPONENTS)
          if ($components.Count -eq 0) { throw "the projection declares no enrolled component" }
          $configPaths = $env:RELEASE_CONFIG_PATHS | ConvertFrom-Json -AsHashtable
          foreach ($component in $components) {
            # The canonical config path is the roster-registered map entry; the release directory is its parent, so a nested component root needs no derived literal.
            if (-not $configPaths.Contains($component)) { throw "the projection declares no canonical config path for '$component'" }
            $releaseDirectory = Split-Path -Parent ([string]$configPaths[$component])
            if ((Split-Path -Leaf $releaseDirectory) -cne "release") { throw "the canonical config path '$($configPaths[$component])' for '$component' is not under a release directory" }
            & dotnet fsi --nologo "$releaseDirectory/Build.fsx"
            if ($LASTEXITCODE -ne 0) { throw "$component distribution build failed (exit $LASTEXITCODE)" }
            & dotnet fsi --nologo "$releaseDirectory/Pin.fsx"
            if ($LASTEXITCODE -ne 0) { throw "$component consumer pin failed (exit $LASTEXITCODE)" }
          }

      - name: build the compiled resolver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & dotnet build infrastructure/resolver/Resolver.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "resolver build failed (exit $LASTEXITCODE)" }
