name: release

# Producer preparation, trusted-publisher construction and publication run in three separate fresh hosted jobs.
# Preparation never holds write authority and refuses to start with publication credentials set; the trusted builder compiles only the audited Sources.json closure; publication alone elevates to write.
# `Participants.json` is the only enrollment authority; each producer's `*/release/Config.fsx` is the only source of SDK/version/runtime/platform; do not restate those values in YAML or global.json.

run-name: release ${{ github.sha }}

# No path filter or dispatch: an unrelated push can still change packaged bytes.
on:
  push:
    branches:
      - main

# Least privilege: read default; only the publication job elevates to write.
permissions:
  contents: read

# queue: max retains pending runs the default single queue would replace; it cannot combine with cancel-in-progress: true.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  bootstrap:
    name: bootstrap canonical toolchain
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sdk: ${{ steps.project.outputs.sdk }}
      runtime: ${{ steps.project.outputs.runtime }}
      platform: ${{ steps.project.outputs.platform }}
      components: ${{ steps.project.outputs.components }}
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: enforce exact event SHA and safe main ancestry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $eventSha = "${{ github.sha }}"
          $repo = "${{ github.repository }}"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $eventSha) {
            throw "checked out HEAD '$head' does not equal the event SHA '$eventSha'"
          }
          # API ancestry keeps persist-credentials: false valid on the checkout above.
          $mainSha = (gh api "repos/$repo/commits/main" --jq ".sha").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
            throw "could not resolve the origin/main tip through the GitHub API"
          }
          if ($eventSha -eq $mainSha) {
            Write-Host "event SHA '$eventSha' is the current origin/main tip"
            exit 0
          }
          # compare status is mainSha relative to eventSha: "ahead"/"identical" means eventSha is an ancestor.
          $status = (gh api "repos/$repo/compare/$eventSha...$mainSha" --jq ".status").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "could not compare event SHA ancestry against origin/main"
          }
          if ($status -ne "ahead" -and $status -ne "identical") {
            throw "event SHA '$eventSha' is not a safe ancestor of origin/main '$mainSha' (compare status '$status'); refusing to release an orphaned or force-pushed revision"
          }
          Write-Host "::warning::event SHA '$eventSha' is a proven ancestor of origin/main '$mainSha' (stale but safe); releasing the exact event SHA and never the newer tip"

      - name: project canonical toolchain (no F# pre-install assumption)
        id: project
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Project

      - name: verify cross-stage enrollment coherence
        shell: pwsh
        # Fails closed when the matrix expression, bootstrap output, fixture wiring, SDK projection or job CLI paths stop matching the roster.
        env:
          # The project step's actual output value: a step-local GITHUB_OUTPUT file holds only that step's own writes.
          PROJECTED_COMPONENTS: ${{ steps.project.outputs.components }}
        run: pwsh infrastructure/release/Coherence.ps1 -Components $env:PROJECTED_COMPONENTS

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.project.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: verify executing toolchain against canonical config
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Verify

      - name: queue cancellation/overflow reconciliation (bounded)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Keep the warn path reachable if a runner enables native-command error preference.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $repo = "${{ github.repository }}"
          # One bounded page only; no unbounded pagination.
          $raw = gh api "repos/$repo/actions/workflows/release.yml/runs?branch=main&event=push&per_page=100" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::queue reconciliation could not read workflow runs: $raw"
            exit 0
          }

          $runs = @((($raw | Out-String) | ConvertFrom-Json).workflow_runs)
          $summary = [System.Text.StringBuilder]::new()
          [void]$summary.AppendLine("### release queue reconciliation")
          [void]$summary.AppendLine("bounded observation: $($runs.Count) recent push run(s) for this workflow on main (per_page=100, single page)")
          [void]$summary.AppendLine("")
          [void]$summary.AppendLine("| run | sha | status | conclusion | created |")
          [void]$summary.AppendLine("| --- | --- | --- | --- | --- |")
          $cancelled = @()
          foreach ($run in $runs) {
            $sha = if ($run.head_sha) { $run.head_sha.Substring(0, 7) } else { "<none>" }
            [void]$summary.AppendLine("| $($run.run_number) | $sha | $($run.status) | $($run.conclusion) | $($run.created_at) |")
            if ($run.conclusion -eq "cancelled" -and $run.event -eq "push") { $cancelled += $run }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary.ToString()

          if ($cancelled.Count -gt 0) {
            $ids = ($cancelled | ForEach-Object { $_.run_number }) -join ", "
            Write-Host "::warning::$($cancelled.Count) cancelled push run(s) observed (run_number: $ids). queue: max queues up to 100 pending runs and cancels only beyond that; reconcile these commits before trusting that every intermediate version was evaluated."
          } else {
            Write-Host "no cancelled push runs observed in the bounded window; release publication remains serialized by queue: max."
          }

  tests:
    name: release regression suite (non-publishing)
    needs: bootstrap
    runs-on: windows-latest
    # Read-only: the gate never publishes; the fixture step reads release assets with the workflow's default token.
    permissions:
      contents: read
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.bootstrap.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: strict FCS typecheck of the retained release scripts
        shell: pwsh
        run: pwsh infrastructure/release/Typecheck.ps1 -SdkVersion "${{ needs.bootstrap.outputs.sdk }}"

      - name: build producers and the two compiled Expecto projects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Build the exact projects the Expecto gates execute; the --no-build runs below then execute that same output.
          dotnet build dotnet/Mcp.Dotnet.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "dotnet producer build failed (exit $LASTEXITCODE)" }
          dotnet build workflow/Mcp.Workflow.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "workflow producer build failed (exit $LASTEXITCODE)" }
          dotnet build dotnet/tests/Mcp.Dotnet.Tests/Mcp.Dotnet.Tests.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "producer Expecto test project build failed (exit $LASTEXITCODE)" }
          dotnet build infrastructure/release/tests/Tests.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "compiled release Expecto project build failed (exit $LASTEXITCODE)" }

      - name: run the producer Expecto gate (native exit preserved)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Actual compiled Expecto entrypoint: no --ignore, no filter, no result rewriting; the native failure exit blocks the release job.
          dotnet run --project dotnet/tests/Mcp.Dotnet.Tests/Mcp.Dotnet.Tests.fsproj -c Release --no-build
          exit $LASTEXITCODE

      - name: run the non-packaging Workflow test entrypoints (native exit preserved)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Read the native exit code instead of letting a native-command error preference throw before it is captured.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          # Explicit deterministic selection of the ten Workflow suites that need no built distribution; never globbed.
          $entrypoints = @(
            "workflow/tests/AuthorityMetadataTests.fsx",
            "workflow/tests/EphemeralLockInvariantTests.fsx",
            "workflow/tests/SchemaParityGuardTests.fsx",
            "workflow/tests/TaskContractTests.fsx",
            "workflow/tests/TaskPathSafetyTests.fsx",
            "workflow/tests/TaskProfileTests.fsx",
            "workflow/tests/WorkflowMcpFindingTests.fsx",
            "workflow/tests/WorkflowMcpNativeCompatTests.fsx",
            "workflow/tests/WorkflowMcpTests.fsx",
            "workflow/tests/WorkflowTests.fsx"
          )
          foreach ($entrypoint in $entrypoints) {
            if (-not (Test-Path -LiteralPath $entrypoint)) { throw "Workflow test entrypoint is missing: $entrypoint" }
            Write-Host "::group::workflow test $entrypoint"
            & dotnet fsi --nologo $entrypoint
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) {
              Write-Host "::error::Workflow test entrypoint failed: $entrypoint (exit $code)"
              exit $code
            }
          }

      - name: provision the pinned historical regression fixtures (read-only release assets)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENTS: ${{ needs.bootstrap.outputs.components }}
        run: |
          $ErrorActionPreference = "Stop"
          # The compiled Historical case owns the fixture version and its hash pins; participants and release tags come from the roster projection.
          $root = Join-Path $env:RUNNER_TEMP "mcp-historical-fixtures"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $fixtureVersion = "v1.0.3"
          $components = @(ConvertFrom-Json $env:RELEASE_COMPONENTS)
          foreach ($component in $components) {
            gh release download $component --repo "${{ github.repository }}" --pattern "$fixtureVersion.zip" --dir $root --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not download the pinned historical asset $component/$fixtureVersion.zip" }
            Move-Item -LiteralPath (Join-Path $root "$fixtureVersion.zip") -Destination (Join-Path $root "$component-$fixtureVersion.zip") -Force
          }
          "MCP_RELEASE_HISTORICAL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: run the complete compiled release regression gate
        shell: pwsh
        # Suite.ps1 fails closed without MCP_RELEASE_HISTORICAL_ROOT, runs the complete compiled suite with a case-count check, and never excludes or rewrites a case.
        run: pwsh infrastructure/release/Suite.ps1

  prepare:
    name: prepare ${{ matrix.component }}
    # Fresh hosted and read-only: preparation sequences the producer Build/Pins/test child scripts and never holds write authority.
    needs:
      - bootstrap
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The roster projection is the only participation list; a hand-edited list here would drift from bootstrap and CLI.
        component: ${{ fromJSON(needs.bootstrap.outputs.components) }}
    outputs:
      # Captured from the upload step so the publication job binds an explicit artifact id and platform digest instead of a floating artifact name.
      candidateArtifactId: ${{ steps.upload.outputs.artifact-id }}
      candidateArtifactDigest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.bootstrap.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: verify executing toolchain against canonical config
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Verify

      - name: prepare the ${{ matrix.component }} candidate
        shell: pwsh
        # Preparation refuses to start while GITHUB_TOKEN or any MCP_RELEASE_* authority variable is set, so this job structurally cannot publish.
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $candidate = Join-Path $env:RUNNER_TEMP "candidate/${{ matrix.component }}"
          $runnerDirectory = Join-Path (Get-Location) "infrastructure/release/bin/Release/net11.0"
          if (-not (Test-Path -LiteralPath (Join-Path $runnerDirectory "ReleaseRunner.exe"))) {
            throw "compiled release runner not found under: $runnerDirectory"
          }
          # The runner resolves the repository root from its own assembly location, so the working directory only shortens the invocation.
          Set-Location $runnerDirectory
          & ./ReleaseRunner.exe prepare "${{ matrix.component }}/release/Config.fsx" $candidate
          exit $LASTEXITCODE

      - name: upload ${{ matrix.component }} candidate transport
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Exactly the two publisher-consumed relative names: the policy-derived archive and the standalone manifest.
          name: release-candidate-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/candidate/${{ matrix.component }}/*.zip
            ${{ runner.temp }}/candidate/${{ matrix.component }}/distribution.json
          if-no-files-found: error

      - name: upload ${{ matrix.component }} preparation metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Diagnostics only: the preparation receipt is never part of the publisher-consumed candidate transport.
          name: candidate-preparation-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/candidate/${{ matrix.component }}/preparation.json
            ${{ runner.temp }}/candidate/${{ matrix.component }}/sha256.txt
          if-no-files-found: warn

  builder:
    name: build-publisher
    # Fresh hosted and read-only: the trusted builder compiles the publisher from the audited Sources.json closure only, outside the producer checkout.
    needs:
      - bootstrap
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      BUILDER_STAGE_ROOT: ${{ runner.temp }}/builder-stage
      BUILDER_OUTPUT_ROOT: ${{ runner.temp }}/builder-output
    outputs:
      runtimeArtifactId: ${{ steps.upload.outputs.artifact-id }}
      runtimeArtifactDigest: ${{ steps.upload.outputs.artifact-digest }}
      envelopeSha256: ${{ steps.build.outputs.envelopeSha256 }}
      manifestSha256: ${{ steps.build.outputs.manifestSha256 }}
      outerTransportPath: ${{ steps.build.outputs.outerTransportPath }}
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.bootstrap.outputs.sdk }}

      - name: verify executing toolchain against canonical config
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Verify

      - name: stage the audited Sources.json closure and the publisher closure
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          # Staging runs before any compile so an unaudited path or build hook can never reach the trusted build.
          pwsh infrastructure/release/Build.ps1 -Phase Stage -Root (Get-Location) -StageRoot "$env:BUILDER_STAGE_ROOT" -OutputRoot "$env:BUILDER_OUTPUT_ROOT" -SourcesPath "infrastructure/release/Sources.json" -PublisherClosure "infrastructure/release/Publisher.json" -Repository "${{ github.repository }}" -BuilderPlatform "${{ needs.bootstrap.outputs.platform }}"
          exit $LASTEXITCODE

      - name: compile the self-contained trusted publisher runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          # Only the staged project compiles; the staged location plus explicit import suppression keep repository and machine build hooks out.
          dotnet publish "${{ steps.stage.outputs.stagedProject }}" -c Release -r "${{ needs.bootstrap.outputs.platform }}" --self-contained true --no-restore -o "${{ steps.stage.outputs.publishRoot }}" -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false
          exit $LASTEXITCODE

      - name: emit the runtime manifest, envelope and trusted receipt
        id: build
        shell: pwsh
        env:
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILDER_TRIGGER: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"
          pwsh infrastructure/release/Build.ps1 -Phase Emit -Root (Get-Location) -StageRoot "$env:BUILDER_STAGE_ROOT" -OutputRoot "$env:BUILDER_OUTPUT_ROOT" -Repository "${{ github.repository }}" -EventSha "${{ github.sha }}" -RunId "$env:BUILDER_RUN_ID" -RunAttempt "$env:BUILDER_RUN_ATTEMPT" -Trigger "$env:BUILDER_TRIGGER" -BuilderSdk "${{ needs.bootstrap.outputs.sdk }}" -BuilderRuntime "${{ needs.bootstrap.outputs.runtime }}" -BuilderPlatform "${{ needs.bootstrap.outputs.platform }}"
          exit $LASTEXITCODE

      - name: upload the trusted publisher runtime transport
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The outer platform zip carries the builder envelope and runtime manifest; its platform digest stays separate from the builder envelope hash.
          name: release-publisher
          path: ${{ runner.temp }}/builder-output/publisher-transport.zip
          if-no-files-found: error

      - name: upload the trusted publisher receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The generated receipt is a separate document at a separate path; it is never written into a candidate payload directory.
          name: trusted-publisher-receipt
          path: ${{ runner.temp }}/builder-output/receipt.json
          if-no-files-found: error

  publish:
    name: publish
    # NOT ENABLED: publish still reads the trusted receipt from <candidate>/receipt.json, so the independently built receipt cannot yet be supplied at an explicit path and the first step fails closed so an early enablement cannot reach a token-bearing invocation.
    if: false
    needs:
      - bootstrap
      - tests
      - prepare
      - builder
    runs-on: windows-latest
    # Publication boundary: this job alone holds write authority; it runs no SDK, build, restore, FSI or test step.
    permissions:
      contents: write
      actions: read
    steps:
      - name: refuse publication until the independent trusted-receipt path is wired
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "::error::publisher-wiring-not-enabled: ReleaseRunner publish reads <candidate>/receipt.json; the trusted publisher receipt must arrive at an explicit independent path. See .tasks/GHI-24/docs/review/Pipeline.md"
          exit 1
