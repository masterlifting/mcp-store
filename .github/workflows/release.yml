name: release

# Telegram source and Telegram workflows are out of scope and are never invoked here.
# `Participants.json` is the only enrollment authority; each producer's `*/release/Config.fsx` is the only source of SDK/version/runtime/platform; do not restate those values in YAML or global.json.
# The read-only tests job runs the producer Expecto gate, a strict FCS typecheck of the retained release scripts, and the compiled release regression gate before any upload; a producer failure never publishes its artifact.

run-name: release ${{ github.sha }}

# No path filter or dispatch: an unrelated push can still change packaged bytes.
on:
  push:
    branches:
      - main

# Least privilege: read default; only the publication job elevates to write.
permissions:
  contents: read

# queue: max retains pending runs the default single queue would replace; it cannot combine with cancel-in-progress: true.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  bootstrap:
    name: bootstrap canonical toolchain
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sdk: ${{ steps.project.outputs.sdk }}
      runtime: ${{ steps.project.outputs.runtime }}
      platform: ${{ steps.project.outputs.platform }}
      components: ${{ steps.project.outputs.components }}
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: enforce exact event SHA and safe main ancestry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $eventSha = "${{ github.sha }}"
          $repo = "${{ github.repository }}"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $eventSha) {
            throw "checked out HEAD '$head' does not equal the event SHA '$eventSha'"
          }
          # API ancestry keeps persist-credentials: false valid on the checkout above.
          $mainSha = (gh api "repos/$repo/commits/main" --jq ".sha").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
            throw "could not resolve the origin/main tip through the GitHub API"
          }
          if ($eventSha -eq $mainSha) {
            Write-Host "event SHA '$eventSha' is the current origin/main tip"
            exit 0
          }
          # compare status is mainSha relative to eventSha: "ahead"/"identical" means eventSha is an ancestor.
          $status = (gh api "repos/$repo/compare/$eventSha...$mainSha" --jq ".status").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "could not compare event SHA ancestry against origin/main"
          }
          if ($status -ne "ahead" -and $status -ne "identical") {
            throw "event SHA '$eventSha' is not a safe ancestor of origin/main '$mainSha' (compare status '$status'); refusing to release an orphaned or force-pushed revision"
          }
          Write-Host "::warning::event SHA '$eventSha' is a proven ancestor of origin/main '$mainSha' (stale but safe); releasing the exact event SHA and never the newer tip"

      - name: project canonical toolchain (no F# pre-install assumption)
        id: project
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Project

      - name: verify cross-stage enrollment coherence
        shell: pwsh
        # Fails closed when the matrix expression, bootstrap output, fixture wiring, SDK projection or CLI entry path stops matching the roster.
        run: pwsh infrastructure/release/Coherence.ps1 -OutputFile $env:GITHUB_OUTPUT

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.project.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: verify executing toolchain against canonical config
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Verify

      - name: queue cancellation/overflow reconciliation (bounded)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Keep the warn path reachable if a runner enables native-command error preference.
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $repo = "${{ github.repository }}"
          # One bounded page only; no unbounded pagination.
          $raw = gh api "repos/$repo/actions/workflows/release.yml/runs?branch=main&event=push&per_page=100" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::queue reconciliation could not read workflow runs: $raw"
            exit 0
          }

          $runs = @((($raw | Out-String) | ConvertFrom-Json).workflow_runs)
          $summary = [System.Text.StringBuilder]::new()
          [void]$summary.AppendLine("### release queue reconciliation")
          [void]$summary.AppendLine("bounded observation: $($runs.Count) recent push run(s) for this workflow on main (per_page=100, single page)")
          [void]$summary.AppendLine("")
          [void]$summary.AppendLine("| run | sha | status | conclusion | created |")
          [void]$summary.AppendLine("| --- | --- | --- | --- | --- |")
          $cancelled = @()
          foreach ($run in $runs) {
            $sha = if ($run.head_sha) { $run.head_sha.Substring(0, 7) } else { "<none>" }
            [void]$summary.AppendLine("| $($run.run_number) | $sha | $($run.status) | $($run.conclusion) | $($run.created_at) |")
            if ($run.conclusion -eq "cancelled" -and $run.event -eq "push") { $cancelled += $run }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary.ToString()

          if ($cancelled.Count -gt 0) {
            $ids = ($cancelled | ForEach-Object { $_.run_number }) -join ", "
            Write-Host "::warning::$($cancelled.Count) cancelled push run(s) observed (run_number: $ids). queue: max queues up to 100 pending runs and cancels only beyond that; reconcile these commits before trusting that every intermediate version was evaluated."
          } else {
            Write-Host "no cancelled push runs observed in the bounded window; release publication remains serialized by queue: max."
          }

  tests:
    name: release regression suite (non-publishing)
    needs: bootstrap
    runs-on: windows-latest
    # Read-only: the gate never publishes; the fixture step reads release assets with the workflow's default token.
    permissions:
      contents: read
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.bootstrap.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: strict FCS typecheck of the retained release scripts
        shell: pwsh
        run: pwsh infrastructure/release/Typecheck.ps1 -SdkVersion "${{ needs.bootstrap.outputs.sdk }}"

      - name: build producers and the two compiled Expecto projects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Build the exact projects the Expecto gates execute; the --no-build runs below then execute that same output.
          dotnet build dotnet/Mcp.Dotnet.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "dotnet producer build failed (exit $LASTEXITCODE)" }
          dotnet build workflow/Mcp.Workflow.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "workflow producer build failed (exit $LASTEXITCODE)" }
          dotnet build dotnet/tests/Mcp.Dotnet.Tests/Mcp.Dotnet.Tests.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "producer Expecto test project build failed (exit $LASTEXITCODE)" }
          dotnet build infrastructure/release/tests/Tests.fsproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "compiled release Expecto project build failed (exit $LASTEXITCODE)" }

      - name: run the producer Expecto gate (native exit preserved)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Actual compiled Expecto entrypoint: no --ignore, no filter, no result rewriting; the native failure exit blocks the release job.
          dotnet run --project dotnet/tests/Mcp.Dotnet.Tests/Mcp.Dotnet.Tests.fsproj -c Release --no-build
          exit $LASTEXITCODE

      - name: provision the pinned historical regression fixtures (read-only release assets)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENTS: ${{ needs.bootstrap.outputs.components }}
        run: |
          $ErrorActionPreference = "Stop"
          # The compiled Historical case owns the fixture version and its hash pins; participants and release tags come from the roster projection.
          $root = Join-Path $env:RUNNER_TEMP "mcp-historical-fixtures"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $fixtureVersion = "v1.0.3"
          $components = @(ConvertFrom-Json $env:RELEASE_COMPONENTS)
          foreach ($component in $components) {
            gh release download $component --repo "${{ github.repository }}" --pattern "$fixtureVersion.zip" --dir $root --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not download the pinned historical asset $component/$fixtureVersion.zip" }
            Move-Item -LiteralPath (Join-Path $root "$fixtureVersion.zip") -Destination (Join-Path $root "$component-$fixtureVersion.zip") -Force
          }
          "MCP_RELEASE_HISTORICAL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: run the complete compiled release regression gate
        shell: pwsh
        # Suite.ps1 fails closed without MCP_RELEASE_HISTORICAL_ROOT, runs the complete compiled suite with a case-count check, and never excludes or rewrites a case.
        run: pwsh infrastructure/release/Suite.ps1

  release:
    name: release ${{ matrix.component }}
    # Publication is gated on the non-publishing regression suite; a failed suite blocks every upload.
    needs:
      - bootstrap
      - tests
    runs-on: windows-latest
    # Publication boundary: this job alone holds write authority.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The roster projection is the only participation list; a hand-edited list here would drift from bootstrap and CLI.
        component: ${{ fromJSON(needs.bootstrap.outputs.components) }}
    steps:
      - name: checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup .NET SDK from canonical config
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.bootstrap.outputs.sdk }}

      - name: build release runner
        run: dotnet build infrastructure/release/Release.fsproj -c Release

      - name: verify executing toolchain against canonical config
        shell: pwsh
        run: pwsh infrastructure/release/Update.ps1 -Verify -Component ${{ matrix.component }}

      - name: recheck exact event SHA and safe main ancestry before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Re-prove the release boundary here: the bootstrap job result is not cached across the test gate.
          $eventSha = "${{ github.sha }}"
          $repo = "${{ github.repository }}"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $eventSha) {
            throw "checked out HEAD '$head' does not equal the event SHA '$eventSha'"
          }
          $mainSha = (gh api "repos/$repo/commits/main" --jq ".sha").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mainSha)) {
            throw "could not resolve the origin/main tip through the GitHub API"
          }
          if ($eventSha -eq $mainSha) {
            Write-Host "event SHA '$eventSha' is the current origin/main tip immediately before publication"
            exit 0
          }
          # compare status is mainSha relative to eventSha: "ahead"/"identical" means eventSha is an ancestor.
          $status = (gh api "repos/$repo/compare/$eventSha...$mainSha" --jq ".status").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "could not compare event SHA ancestry against origin/main"
          }
          if ($status -ne "ahead" -and $status -ne "identical") {
            throw "event SHA '$eventSha' is not a safe ancestor of origin/main '$mainSha' (compare status '$status'); refusing to publish an orphaned or force-pushed revision"
          }
          Write-Host "::warning::event SHA '$eventSha' is a proven ancestor of origin/main '$mainSha' (stale but safe); publishing the exact event SHA and never the newer tip"

      - name: run ${{ matrix.component }} release transaction
        id: transaction
        shell: pwsh
        # Upload gate and GITHUB_TOKEN are exposed only at this publication boundary.
        env:
          MCP_RELEASE_GITHUB_OWNER: ${{ github.repository_owner }}
          MCP_RELEASE_GITHUB_REPOSITORY: ${{ github.event.repository.name }}
          MCP_RELEASE_DO_UPLOAD: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "${{ matrix.component }}-release.log"
          $exitFile = Join-Path $env:RUNNER_TEMP "${{ matrix.component }}-exit-code.txt"
          # The compiled runner is the per-component entrypoint; it sequences build, pins, distribution tests, then the compiled transaction.
          $runner = Join-Path (Get-Location) "infrastructure/release/bin/Release/net11.0/ReleaseRunner.exe"
          if (-not (Test-Path -LiteralPath $runner)) { throw "compiled release runner not found: $runner" }
          & $runner orchestrate "${{ matrix.component }}/release/Config.fsx" *>&1 | Tee-Object -FilePath $log
          # Tee-Object does not reset $LASTEXITCODE; exit explicitly so a summary write cannot mask a non-zero result.
          $code = $LASTEXITCODE
          "$code" | Out-File -FilePath $exitFile -Encoding ascii
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $code

      - name: append ${{ matrix.component }} structured release result
        if: always()
        shell: pwsh
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "$env:COMPONENT-release.log"
          $exitFile = Join-Path $env:RUNNER_TEMP "$env:COMPONENT-exit-code.txt"
          $code = if (Test-Path -LiteralPath $exitFile) { [int]((Get-Content -LiteralPath $exitFile) -join "").Trim() } else { -1 }
          $lines = @()
          if (Test-Path -LiteralPath $log) { $lines = @(Get-Content -LiteralPath $log) }

          # The compiled runner emits one JSON object (status plus config context) on stdout before every exit; a `key=value` line is still tolerated as a fallback.
          $fields = @{}
          $diagnostics = New-Object System.Collections.Generic.List[string]
          $jsonStart = -1
          for ($n = 0; $n -lt $lines.Count; $n++) {
            if ("$($lines[$n])".Trim() -eq "{") { $jsonStart = $n; break }
          }
          if ($jsonStart -ge 0) {
            try {
              $obj = ($lines[$jsonStart..($lines.Count - 1)] -join "`n") | ConvertFrom-Json
              foreach ($prop in $obj.PSObject.Properties) {
                if ($null -ne $prop.Value -and "$($prop.Value)" -ne "") { $fields[$prop.Name] = "$($prop.Value)" }
              }
            } catch {
              $jsonStart = -1
            }
          }
          if ($jsonStart -lt 0) {
            foreach ($line in $lines) {
              if ($line -match '^([A-Za-z][A-Za-z0-9]*)=(.*)$') {
                $fields[$Matches[1]] = $Matches[2]
              } elseif (-not [string]::IsNullOrWhiteSpace($line) -and -not $line.StartsWith("#")) {
                [void]$diagnostics.Add($line)
              }
            }
          }

          function Get-Field([string]$key) { if ($fields.ContainsKey($key)) { $fields[$key] } else { $null } }

          # A bare exit code is never a status: without the structured `status` line the result is evidence-only.
          $structured = $fields.ContainsKey("status")
          $status = if ($structured) { $fields["status"] } else { "failed" }
          $reason = if ($fields.ContainsKey("reason")) { $fields["reason"] } elseif ($structured) { "the release entrypoint emitted no reason" } else { "the release entrypoint emitted no structured status; the exit code alone is not publication evidence" }

          # Verified publication requires observed remote values; unchanged reports observed published values, never candidate pins.
          $publishedArchive = Get-Field "publishedArchiveSha256"
          $publishedManifest = Get-Field "publishedManifestSha256"
          $publishedRevision = Get-Field "publishedRevision"
          $publishedMetadataSha = Get-Field "publishedMetadataSha256"
          $verifiedPublished = ($status -eq "published") -and $publishedArchive -and $publishedMetadataSha
          $verifiedUnchanged = ($status -eq "unchanged") -and $publishedArchive -and $publishedManifest -and $publishedRevision
          $verified = [bool]($verifiedPublished -or $verifiedUnchanged)
          $kind = if ($verifiedPublished) { "verified-published" } elseif ($verifiedUnchanged) { "verified-observed-published" } else { "status-evidence-only" }

          # A verified projection is copied only when it carries archive sha, manifest sha, and published revision matching the observed archive.
          $projection = @{}
          $projectionValid = $false
          $projectionPath = Get-Field "metadataLocalPath"
          if ($verified -and $projectionPath -and (Test-Path -LiteralPath $projectionPath)) {
            try {
              $proj = Get-Content -LiteralPath $projectionPath -Raw | ConvertFrom-Json
              foreach ($p in $proj.PSObject.Properties) { $projection[$p.Name] = "$($p.Value)" }
            } catch { }
            $projectionValid = $projection.ContainsKey("archiveSha256") -and $projection["archiveSha256"] `
              -and $projection.ContainsKey("manifestSha256") -and $projection["manifestSha256"] `
              -and $projection.ContainsKey("publishedRevision") -and $projection["publishedRevision"] `
              -and $projection["archiveSha256"] -eq $publishedArchive
            if ($projectionValid) {
              if (-not $publishedManifest) { $publishedManifest = $projection["manifestSha256"] }
              if (-not $publishedRevision) { $publishedRevision = $projection["publishedRevision"] }
            }
          }

          $record = [ordered]@{
            component = $env:COMPONENT
            status = $status
            verified = $verified
            projectionKind = $kind
            structuredResult = $structured
            exitCode = $code
            reason = $reason
            version = Get-Field "version"
            archiveName = Get-Field "archiveName"
            assetUri = Get-Field "assetUri"
            phase = Get-Field "phase"
            childExitCode = Get-Field "childExitCode"
            metadataAssetName = Get-Field "metadataAssetName"
            currentEvaluatedHead = Get-Field "currentEvaluatedHead"
            candidateRevision = Get-Field "candidateRevision"
            candidateArchiveSha256 = Get-Field "candidateArchiveSha256"
            candidateManifestSha256 = Get-Field "candidateManifestSha256"
            producerSdk = Get-Field "producerSdk"
            producerRuntime = Get-Field "producerRuntime"
            producerPlatform = Get-Field "producerPlatform"
            bumpedVersion = Get-Field "bumpedVersion"
            published = if ($verified) { [ordered]@{
              archiveSha256 = $publishedArchive
              manifestSha256 = $publishedManifest
              revision = $publishedRevision
              metadataSha256 = $publishedMetadataSha
            } } else { $null }
            diagnostics = @($diagnostics | Select-Object -First 20)
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "release-status-$env:COMPONENT.json") -Encoding utf8

          $human = New-Object System.Collections.Generic.List[string]
          [void]$human.Add("## $env:COMPONENT release")
          [void]$human.Add("status=$status verified=$verified structured=$structured exitCode=$code projectionKind=$kind")
          [void]$human.Add("reason=$reason")
          [void]$human.Add("")
          [void]$human.Add("### structured result (candidate/typed values are not published values)")
          foreach ($key in @("version","archiveName","assetUri","phase","childExitCode","metadataAssetName","currentEvaluatedHead","candidateRevision","candidateArchiveSha256","candidateManifestSha256","producerSdk","producerRuntime","producerPlatform","bumpedVersion")) {
            $value = Get-Field $key
            if ($null -ne $value -and "$value" -ne "") { [void]$human.Add("$key=$value") }
          }
          if ($verified) {
            [void]$human.Add("")
            [void]$human.Add("### verified published values (observed remote)")
            [void]$human.Add("publishedArchiveSha256=$publishedArchive")
            if ($publishedManifest) { [void]$human.Add("publishedManifestSha256=$publishedManifest") }
            if ($publishedRevision) { [void]$human.Add("publishedRevision=$publishedRevision") }
            if ($publishedMetadataSha) { [void]$human.Add("publishedMetadataSha256=$publishedMetadataSha") }
          } else {
            [void]$human.Add("")
            [void]$human.Add("### failure evidence (no verified publication)")
            if (Get-Field "childStderr") { [void]$human.Add("childStderr=$(Get-Field 'childStderr')") }
            if ($diagnostics.Count -gt 0) {
              foreach ($d in ($diagnostics | Select-Object -First 20)) { [void]$human.Add($d) }
            } elseif (-not (Get-Field "childStderr")) {
              [void]$human.Add("<no additional diagnostic lines captured>")
            }
          }
          if ($projectionValid) {
            Copy-Item -LiteralPath $projectionPath -Destination (Join-Path $env:RUNNER_TEMP "published-metadata-$env:COMPONENT.json") -Force
            [void]$human.Add("")
            [void]$human.Add("### verified published metadata projection (archive sha, manifest sha, published revision)")
            [void]$human.Add('```json')
            foreach ($l in (Get-Content -LiteralPath $projectionPath)) { [void]$human.Add($l) }
            [void]$human.Add('```')
          } elseif ($verified) {
            [void]$human.Add("::warning::verified status but the local metadata projection was not found or did not match the observed archive sha")
          }
          $pins = Join-Path (Get-Location) "$env:COMPONENT/dist/consumer-pins.json"
          if (Test-Path -LiteralPath $pins) {
            [void]$human.Add("")
            [void]$human.Add("### candidate consumer pins (candidate pin preparation only; NOT release metadata)")
            [void]$human.Add('```json')
            foreach ($l in (Get-Content -LiteralPath $pins)) { [void]$human.Add($l) }
            [void]$human.Add('```')
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($human -join "`n")

      - name: upload ${{ matrix.component }} verified release metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Verified output only; unverified candidate values are never emitted here.
          name: release-metadata-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/release-status-${{ matrix.component }}.json
            ${{ runner.temp }}/published-metadata-${{ matrix.component }}.json
          if-no-files-found: warn

      - name: upload ${{ matrix.component }} candidate consumer pins
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-consumer-pins-${{ matrix.component }}
          path: ${{ matrix.component }}/dist/consumer-pins.json
          if-no-files-found: warn
